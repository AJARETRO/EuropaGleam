name: Release EuropaGleam APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v20.2.6-europa1). Leave blank to auto-generate from version.'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release title (optional, e.g. EuropaGleam v20.2.6-europa1)'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Release description / changelog (optional)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish EuropaGleam Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Release Metadata
        id: meta
        run: |
          VERSION="20.2.6"
          INPUT_TAG="${{ inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}-europa.${{ github.run_number }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "APP_VERSION=${TAG#v}" >> $GITHUB_ENV

          INPUT_TITLE="${{ inputs.release_title }}"
          if [ -n "$INPUT_TITLE" ]; then
            TITLE="$INPUT_TITLE"
          else
            TITLE="EuropaGleam $TAG"
          fi
          echo "RELEASE_TITLE=$TITLE" >> $GITHUB_ENV

      - name: Build Release APKs
        run: |
          ./gradlew assembleNonRoot_gameRelease assembleRootRelease -PversionName="${{ env.APP_VERSION }}" -x lint --stacktrace

      - name: Sign & Prepare Release Assets
        id: prepare_assets
        run: |
          mkdir -p release_assets
          TAG="${{ env.RELEASE_TAG }}"
          TITLE="${{ env.RELEASE_TITLE }}"

          # Find apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # Keystore setup: use secret if available, otherwise use committed repository release.keystore
          KEYSTORE="app/release.keystore"
          KS_PASS="europagleam"
          ALIAS="europagleam"

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from repository secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $KEYSTORE
            KS_PASS="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
            ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
          else
            echo "Using official committed EuropaGleam release keystore ($KEYSTORE)..."
          fi

          # Sign all NonRoot APKs (standard user APKs: universal, arm64-v8a, armeabi-v7a, x86, x86_64)
          find app/build/outputs/apk/nonRoot_game/release -type f -name "*.apk" | while read -r apk; do
            base=$(basename "$apk" .apk | sed -E 's/app-//; s/-release//; s/-unsigned//')
            out="release_assets/EuropaGleam-${TAG}-${base}.apk"
            $APKSIGNER sign --ks $KEYSTORE --ks-pass pass:$KS_PASS --ks-key-alias $ALIAS --key-pass pass:$KS_PASS --out "$out" "$apk"
            echo "Signed and created: $out"
          done

          # Sign all Root APKs
          find app/build/outputs/apk/root/release -type f -name "*.apk" | while read -r apk; do
            base=$(basename "$apk" .apk | sed -E 's/app-//; s/-release//; s/-unsigned//')
            out="release_assets/EuropaGleam-${TAG}-${base}.apk"
            $APKSIGNER sign --ks $KEYSTORE --ks-pass pass:$KS_PASS --ks-key-alias $ALIAS --key-pass pass:$KS_PASS --out "$out" "$apk"
            echo "Signed and created: $out"
          done

          # Compute SHA-256 checksums
          cd release_assets
          sha256sum *.apk > sha256sums.txt
          echo "Generated Checksums:"
          cat sha256sums.txt
          cd ..

      - name: Generate Release Notes
        run: |
          INPUT_NOTES="${{ inputs.release_notes }}"
          if [ -n "$INPUT_NOTES" ]; then
            echo "$INPUT_NOTES" > release_notes.md
          else
            cat << 'EOF' > release_notes.md
          ## EuropaGleam Release

          High-performance GameStream / Sunshine / Apollo client for Android based on Artemis Android Extended.

          ### Highlights & Features:
          - **Standalone Package ID (`dev.ajaretro.europagleam`)**: Installable alongside Artemis and vanilla Moonlight with zero package or provider conflicts.
          - **ajaretro.dev Brand Identity**: Official brand icon with high-res launcher assets and custom styling.
          - **Target Android 12 (API 31)**: Optimized modern runtime compatibility and permissions.
          - **Background Streaming**: Stream continues active when the app is minimized or switched away, backed by a persistent low-priority foreground service.
          - **Hot-Swappable Background Audio**: Seamlessly listen to game audio in the background or mute audio cleanly to preserve device battery, togglable anytime in settings or the in-game quick menu.
          - **Scroll Lock Anti-Timeout Keepalive**: Transmits virtual Scroll Lock pulses at randomized 1 min (±30s) intervals to keep remote host sessions awake and prevent idle screensaver/timeout (`Always`, `Background Only`, or `Disabled`).
          - **Battery Saver & Restriction Shield**: Live detection and actionable prompts for Android Battery Saver, Doze restrictions, and OEM background killers.
          - **Wi-Fi Only & Mobile Data Auto-Disconnect**: Automatically disconnects stream if Wi-Fi drops and transitions to cellular mobile data to avoid accidental high carrier usage. Can be overridden in settings or in-game menu.
          - **Session Disconnect Diagnostics & Event Logger**: Full timestamped log of stream events, keepalive pulses, and exact disconnect reasons with a top-bar diagnostic viewer and one-tap clipboard export.
          - **Smart Wi-Fi Auto-Reconnect**: Automatically reconnects with a sleek 3-second countdown if disconnected due to temporary network blips while on Wi-Fi.
          - **Screen Wakeup & Idle Fix (Black Screen Resolved)**: Immediate IDR keyframe request and surface re-synchronization when resuming from screen lock or background, preventing black/frozen frames.
          - **In-App Auto-Updater**: Instant top-bar and settings update button querying GitHub Releases API with ABI-optimized APK downloading (~38 MB ARM64) and direct installer prompt.
          - **Game Mode & Funtouch OS Esports Integration**: Marked with `isGame="true"`, `appCategory="game"`, performance game mode config, and Vivo Esports metadata triggers.
          - **Native Wireless DualSense (PS5) Support**: Adaptive triggers, HD haptics, motion/gyro relay, DualSense controller speaker audio, and microphone routing.

          ### Downloads:
          - **`EuropaGleam-...-arm64-v8a.apk`**: (~38 MB) **Recommended** for modern Android phones and tablets.
          - **`EuropaGleam-...-universal.apk`**: Universal build containing all CPU architectures.
          - **`EuropaGleam-...-root.apk`**: For rooted devices requiring direct low-level input capture.

          ### Verification:
          Refer to `sha256sums.txt` to verify file integrity.
          EOF
          fi

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release_notes.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            release_assets/*.apk
            release_assets/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-apks
          path: release_assets/
          retention-days: 30
